# Virtuoso NetSoft IoT (ThingsBoard) SSO — second instance on same host as viot.variphi.com.
#
# Uses separate DB (tb_virtuoso), Redis DB index, and host ports 9091/1884/8884.
# Uses Keycloak realm "viot" and OAuth client "viot".
#
# Run:
#   ./start-virtuoso-sso.sh up -d mytb
#
# First-time DB: clone from tb + migrate-cloned-tb-domain.sql (skip tb-install).

x-tb-db-env: &tb-db-env
  SPRING_DATASOURCE_URL: "jdbc:postgresql://${DATABASE_HOST:-3.110.77.148}:${DATABASE_PORT:-5432}/${DATABASE_NAME:-tb_virtuoso}"
  SPRING_DATASOURCE_USERNAME: "${DATABASE_USER:-variphi}"
  SPRING_DATASOURCE_PASSWORD: "${DATABASE_PASSWORD:-vgi@2026}"
  DATABASE_TS_TYPE: "${DATABASE_TS_TYPE:-sql}"
  DATABASE_TS_LATEST_TYPE: "${DATABASE_TS_LATEST_TYPE:-sql}"
  SQL_TIMESCALE_CHUNK_TIME_INTERVAL: "${SQL_TIMESCALE_CHUNK_TIME_INTERVAL:-604800000}"
  SQL_TIMESCALE_BATCH_THREADS: "${SQL_TIMESCALE_BATCH_THREADS:-3}"
  TB_QUEUE_TYPE: "in-memory"
  TB_SERVICE_TYPE: "monolith"

x-tb-cache-env: &tb-cache-env
  CACHE_TYPE: "${CACHE_TYPE:-redis}"
  REDIS_CONNECTION_TYPE: "${REDIS_CONNECTION_TYPE:-standalone}"
  REDIS_HOST: "${REDIS_HOST:-3.110.77.148}"
  REDIS_PORT: "${REDIS_PORT:-6379}"
  REDIS_DB: "${REDIS_DB:-1}"
  REDIS_PASSWORD: "${REDIS_PASSWORD:-}"

services:
  tb-install:
    image: ${TB_IMAGE:-virtuosonetsoft/tb-node:latest}
    pull_policy: never
    build:
      context: ../msa/tb-node/target
      dockerfile: Dockerfile
    profiles: ["install"]
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: [*tb-db-env, *tb-cache-env]
      INSTALL_TB: "true"
      LOAD_DEMO: "${LOAD_DEMO:-false}"
      SECURITY_OAUTH2_KEYCLOAK_ENABLED: "true"
      SECURITY_OAUTH2_KEYCLOAK_TITLE: "${SECURITY_OAUTH2_KEYCLOAK_TITLE:-Virtuoso IoT SSO}"
      SECURITY_OAUTH2_KEYCLOAK_CLIENT_ID: "${SECURITY_OAUTH2_KEYCLOAK_CLIENT_ID:-viot}"
      SECURITY_OAUTH2_KEYCLOAK_CLIENT_SECRET: "${TB_OAUTH2_CLIENT_SECRET:-thingsboard-oauth2-secret}"
      SECURITY_OAUTH2_KEYCLOAK_ISSUER_URI: "${SECURITY_OAUTH2_KEYCLOAK_ISSUER_URI:-http://host.docker.internal:8081/realms/viot}"
      SECURITY_OAUTH2_KEYCLOAK_AUTH_ISSUER_URI: "${SECURITY_OAUTH2_KEYCLOAK_AUTH_ISSUER_URI:-}"
      SECURITY_OAUTH2_KEYCLOAK_DOMAIN_NAME: "${SECURITY_OAUTH2_KEYCLOAK_DOMAIN_NAME:-localhost:9091}"
      SECURITY_OAUTH2_KEYCLOAK_SCOPES: "openid,email,profile"

  mytb:
    image: ${TB_IMAGE:-virtuosonetsoft/tb-node:latest}
    pull_policy: never
    build:
      context: ../msa/tb-node/target
      dockerfile: Dockerfile
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9091:8080"
      - "1884:1883"
      - "8884:8883"
    environment:
      <<: [*tb-db-env, *tb-cache-env]
      SECURITY_OAUTH2_KEYCLOAK_ENABLED: "true"
      SECURITY_OAUTH2_KEYCLOAK_TITLE: "${SECURITY_OAUTH2_KEYCLOAK_TITLE:-Virtuoso IoT SSO}"
      SECURITY_OAUTH2_KEYCLOAK_CLIENT_ID: "${SECURITY_OAUTH2_KEYCLOAK_CLIENT_ID:-viot}"
      SECURITY_OAUTH2_KEYCLOAK_CLIENT_SECRET: "${TB_OAUTH2_CLIENT_SECRET:-thingsboard-oauth2-secret}"
      SECURITY_OAUTH2_KEYCLOAK_ISSUER_URI: "${SECURITY_OAUTH2_KEYCLOAK_ISSUER_URI:-http://host.docker.internal:8081/realms/viot}"
      SECURITY_OAUTH2_KEYCLOAK_AUTH_ISSUER_URI: "${SECURITY_OAUTH2_KEYCLOAK_AUTH_ISSUER_URI:-}"
      SECURITY_OAUTH2_KEYCLOAK_DOMAIN_NAME: "${SECURITY_OAUTH2_KEYCLOAK_DOMAIN_NAME:-localhost:9091}"
      SECURITY_OAUTH2_KEYCLOAK_SCOPES: "openid,email,profile"
      DEVICE_CONNECTIVITY_HTTP_HOST: "${DEVICE_CONNECTIVITY_HTTP_HOST:-localhost}"
      DEVICE_CONNECTIVITY_HTTP_PORT: "${DEVICE_CONNECTIVITY_HTTP_PORT:-9091}"
      DEVICE_CONNECTIVITY_MQTT_HOST: "${DEVICE_CONNECTIVITY_MQTT_HOST:-localhost}"
      DEVICE_CONNECTIVITY_MQTT_PORT: "${DEVICE_CONNECTIVITY_MQTT_PORT:-1884}"
      MQTT_SSL_ENABLED: "true"
      MQTT_SSL_CREDENTIALS_TYPE: "PEM"
      MQTT_SSL_PEM_CERT: "/mqtt-certs/server.pem"
      MQTT_SSL_PEM_KEY: "/mqtt-certs/server_key.pem"
      MQTT_SSL_BIND_PORT: "8883"
    volumes:
      - tb-logs:/var/log/thingsboard
      - ./virtuoso-mqtt-certs:/mqtt-certs:ro

volumes:
  tb-logs:
